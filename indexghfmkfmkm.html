function showLeaderboard(scores, week){
  var weekTxt = week ? ' — nädal '+week : '';
  var titleEl = document.getElementById('lbTitle');
  if(titleEl) titleEl.textContent='🏆 Edetabel'+weekTxt;
  var html='';
  var nick=window._pirNick||'';
  if(!scores||scores.length===0){
    html='<div style="text-align:center;color:#888;padding:20px 0;">Veel pole skooreid kirjas</div>';
  } else {
    scores.forEach(function(s,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span style="color:#888">'+(i+1)+'.</span>';
      var isMe=(nick&&s.nickname===nick&&s.score===lastScore);
      var bg=isMe?(i===0?'rgba(255,215,0,0.15)':i===1?'rgba(192,192,192,0.15)':i===2?'rgba(205,127,50,0.15)':'rgba(255,255,255,0.05)'):'';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-bottom:1px solid #2a1800;border-radius:4px;background:'+bg+'">'+
        '<span>'+medal+' '+s.nickname+(isMe?' ◀':'')+'</span>'+
        '<span style="color:#FFD700;font-weight:bold;">'+s.score+'</span></div>';
    });
  }
  document.getElementById('lbList').innerHTML=html;
  lbDiv.style.display='flex';
  formDiv.style.display='none';
}

function jsonp(url, cb){
  var name='cb_'+Math.round(Math.random()*1e6);
  window[name]=function(data){cb(data);delete window[name];var el=document.getElementById(name);if(el)el.remove();};
  var s=document.createElement('script');
  s.id=name;
  s.src=url+'&callback='+name;
  s.onerror=function(){cb({});};
  document.head.appendChild(s);
}

function fetchLeaderboard(cb){
  jsonp(SCRIPT_URL+'?action=leaderboard', function(d){ cb(d.scores||[], d.week); });
}

function saveScore(nick,em,sc,cb){
  var url=SCRIPT_URL+'?action=save&nickname='+encodeURIComponent(nick)+'&email='+encodeURIComponent(em||'')+'&score='+sc;
  jsonp(url, function(){ cb(); });
}

function go(ex, ey){
  if(S==='start'){showForm();return;}
  if(S==='dead'){
    // Mängi uuesti nupp
    var bx=W/2-55, by=H/2+88, bw=110, bh=30;
    if(ex>=bx&&ex<=bx+bw&&ey>=by&&ey<=by+bh){S='play';init();return;}
    // Vaata edetabelit nupp
    var lx=W/2-75, ly=H/2+124, lw=150, lh=28;
    if(ex>=lx&&ex<=lx+lw&&ey>=ly&&ey<=ly+lh){
      // Show loading in leaderboard div immediately
      document.getElementById('lbList').innerHTML='<div style="text-align:center;color:#aaa;padding:20px 0;">⏳ Laen edetabelit...</div>';
      lbDiv.style.display='flex';
      fetchLeaderboard(function(scores,week){showLeaderboard(scores,week);});
      return;
    }
    return;
  }
  if(S==='play'){bird.vy=FLAP;bird.f=10;}
}

function drawSeabed(){
  var seaY=H*0.30;
  // seaweed clusters at fixed positions (scroll with tk)
  var weeds=[30,90,150,210,270,330,390,450,510];
  weeds.forEach(function(wx){
    var x=((wx-tk*0.8)%(W+60)+W+60)%(W+60)-30;
    var h=18+Math.sin(wx*0.3)*10;
    // 2-3 strands per cluster
    [-5,0,6].forEach(function(ox,i){
      ctx.strokeStyle=i===1?'#1a7a30':'#158028';
      ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(x+ox,H);
      ctx.bezierCurveTo(
        x+ox+Math.sin(tk*0.05+i)*6, H-h*0.4,
        x+ox-Math.sin(tk*0.04+i)*8, H-h*0.75,
        x+ox+Math.sin(tk*0.06+i)*4, H-h
      );
      ctx.stroke();
    });
  });

  // treasure chests at fixed positions
  var chests=[120,320,500];
  chests.forEach(function(cx){
    var x=((cx-tk*0.8)%(W+80)+W+80)%(W+80)-40;
    var y=H-16;
    var w=22,h=15;
    // chest body
    ctx.fillStyle='#5a2d00';ctx.fillRect(x-w/2,y-h,w,h);
    // chest lid (arched)
    ctx.fillStyle='#7a3e00';
    ctx.beginPath();ctx.ellipse(x,y-h,w/2,7,0,Math.PI,0);ctx.fill();
    // metal bands
    ctx.strokeStyle='#8B6914';ctx.lineWidth=1.5;
    ctx.strokeRect(x-w/2,y-h,w,h);
    ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x,y);ctx.stroke();
    // lock
    ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(x,y-h/2,2.5,0,Math.PI*2);ctx.fill();
    // gold coins spilling
    ctx.fillStyle='#FFD700';
    [-8,-4,3,7].forEach(function(ox){
      ctx.beginPath();ctx.ellipse(x+ox,y-1,3,2,0,0,Math.PI*2);ctx.fill();
    });
  });
}

function sky(){
  // sky = top 30%
  ctx.fillStyle='#3fa8d8';ctx.fillRect(0,0,W,H*0.30);
  ctx.fillStyle='rgba(255,255,255,0.7)';
  [[50,30,14],[180,20,11],[310,35,13]].forEach(function(cl){
    var ox=((cl[0]-tk*0.25)%(W+60)+W+60)%(W+60)-30;
    ctx.beginPath();ctx.arc(ox,cl[1],cl[2]*1.6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ox-cl[2],cl[1]+5,cl[2],0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(ox+cl[2],cl[1]+5,cl[2],0,Math.PI*2);ctx.fill();
  });
  // sea = bottom 70%
  var seaY=H*0.30;
  var seaGrad=ctx.createLinearGradient(0,seaY,0,H);
  seaGrad.addColorStop(0,'#1a78c2');
  seaGrad.addColorStop(1,'#0a3d6b');
  ctx.fillStyle=seaGrad;ctx.fillRect(0,seaY,W,H-seaY);

  // animated wave surface
  ctx.fillStyle='#1e8ad4';
  ctx.beginPath();
  ctx.moveTo(0,seaY);
  for(var x=0;x<=W;x+=3){
    var wy=seaY+Math.sin((x+tk*2)*0.04)*12+Math.sin((x+tk*1.3)*0.07)*6;
    ctx.lineTo(x,wy);
  }
  ctx.lineTo(W,seaY-10);ctx.lineTo(0,seaY-10);ctx.closePath();ctx.fill();

  // wave lines below surface
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1.5;
  for(var i=0;i<5;i++){
    ctx.beginPath();
    for(var x2=0;x2<=W;x2+=4){
      var wy2=seaY+20+i*22+Math.sin((x2+tk*1.5+i*30)*0.055)*5;
      x2===0?ctx.moveTo(x2,wy2):ctx.lineTo(x2,wy2);
    }
    ctx.stroke();
  }
}
function skull(cx,cy,r){
  ctx.fillStyle='#fff8dc';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(cx-r*.3,cy-r*.1,r*.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*.3,cy-r*.1,r*.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(cx-r*.45,cy+r*.28,r*.9,r*.4);
  ctx.fillStyle='#fff8dc';for(var i=0;i<3;i++)ctx.fillRect(cx-r*.4+i*r*.32,cy+r*.3,r*.2,r*.37);
}
function cannon(cx,cy){
  ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(cx,cy,16,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(cx-5,cy-8,10,8);
  ctx.fillStyle='#7a3800';
  ctx.beginPath();ctx.arc(cx-12,cy+5,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+12,cy+5,6,0,Math.PI*2);ctx.fill();
}
function drawPipe(p){
  var gap=p.gap||GAP;
  var g=ctx.createLinearGradient(p.x,0,p.x+PW,0);
  g.addColorStop(0,'#6d3400');g.addColorStop(.5,'#c27a2a');g.addColorStop(1,'#6d3400');
  ctx.fillStyle=g;ctx.fillRect(p.x,0,PW,p.top);
  for(var py=8;py<p.top-8;py+=20){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(p.x+3,py,PW-6,4);}
  skull(p.x+PW/2,p.top-12,11);
  var by=p.top+gap;
  ctx.fillStyle=g;ctx.fillRect(p.x,by,PW,H-by);
  for(var py2=by+8;py2<H;py2+=20){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(p.x+3,py2,PW-6,4);}
  cannon(p.x+PW/2,by+13);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=1.5;
  ctx.strokeRect(p.x,0,PW,p.top);ctx.strokeRect(p.x,by,PW,H-by);
}
function drawDrop(d){
  var img, dw, dh;
  if(d.t==='p'){ img=PIR_IMG; dw=54; dh=60; }
  else { img=KV_IMG; dw=22; dh=66; }
  ctx.save();
  ctx.translate(d.x+dw/2, d.y+dh/2);
  ctx.rotate(Math.sin(tk*0.08+d.ph)*0.15);
  ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  ctx.restore();
  var r=Math.max(dw,dh)/2;
  ctx.strokeStyle=d.t==='p'?'rgba(255,215,0,0.6)':'rgba(200,131,10,0.6)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(d.x+dw/2,d.y+dh/2,r+3+Math.sin(tk*.1)*2,0,Math.PI*2);ctx.stroke();
}
function parrot(bx,by,bvy,bf){
  ctx.save();ctx.translate(bx,by);
  ctx.rotate(Math.min(Math.max(bvy*.035,-.2),.3));
  ctx.scale(0.75, 0.75);

  // === HULL - deep carved galleon shape ===
  // shadow under hull
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(2,24,38,6,0,0,Math.PI*2);ctx.fill();

  // main hull body
  ctx.fillStyle='#5c2800';
  ctx.beginPath();
  ctx.moveTo(-38,4);
  ctx.bezierCurveTo(-42,10,-36,22,-28,24);
  ctx.lineTo(32,24);
  ctx.bezierCurveTo(42,22,44,12,38,4);
  ctx.closePath();ctx.fill();

  // hull planks shading
  ctx.fillStyle='#7a3800';
  ctx.beginPath();
  ctx.moveTo(-38,4);ctx.bezierCurveTo(-42,10,-36,22,-28,24);
  ctx.lineTo(32,24);ctx.bezierCurveTo(42,22,44,12,38,4);
  ctx.lineTo(20,4);ctx.lineTo(-20,4);ctx.closePath();ctx.fill();

  // hull gold trim lines
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-37,8);ctx.bezierCurveTo(-38,12,-30,18,-24,19);ctx.lineTo(28,19);ctx.bezierCurveTo(36,18,40,12,39,8);ctx.stroke();
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-35,13);ctx.bezierCurveTo(-35,16,-28,20,-22,21);ctx.lineTo(26,21);ctx.bezierCurveTo(34,20,37,16,37,13);ctx.stroke();

  // stern castle (back/right)
  ctx.fillStyle='#6d3200';
  ctx.fillRect(26,-8,16,12);
  ctx.fillStyle='#8a4200';
  ctx.fillRect(28,-10,12,4);
  // stern windows
  ctx.fillStyle='#FFD700';
  ctx.fillRect(29,-8,4,4);ctx.fillRect(35,-8,4,4);
  ctx.fillStyle='rgba(150,220,255,0.5)';
  ctx.fillRect(30,-7,2,2);ctx.fillRect(36,-7,2,2);

  // bow (front/left) - pointed
  ctx.fillStyle='#7a3800';
  ctx.beginPath();ctx.moveTo(-38,4);ctx.lineTo(-50,10);ctx.lineTo(-38,16);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#FFD700';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-38,8);ctx.lineTo(-48,10);ctx.stroke();

  // bowsprit (diagonal front mast)
  ctx.strokeStyle='#4a2000';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-36,2);ctx.lineTo(-58,-14);ctx.stroke();

  // deck
  ctx.fillStyle='#a06028';
  ctx.fillRect(-36,-2,74,8);
  // deck planks
  ctx.strokeStyle='#8a4e18';ctx.lineWidth=0.8;
  for(var dp=-30;dp<36;dp+=8){ctx.beginPath();ctx.moveTo(dp,-2);ctx.lineTo(dp,6);ctx.stroke();}

  // === CANNONS - 3 per side on hull ===
  ctx.fillStyle='#222';
  [-24,-8,8].forEach(function(cx2){
    ctx.beginPath();ctx.ellipse(cx2,6,7,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.fillRect(cx2-5,4,10,3);ctx.fillStyle='#222';
  });

  // === FOREMAST (left) ===
  ctx.strokeStyle='#3d1f00';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-14,2);ctx.lineTo(-14,-42);ctx.stroke();
  // fore yard arm
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-14,-32);ctx.lineTo(-32,-28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-32);ctx.lineTo(0,-29);ctx.stroke();
  // fore topsail yard
  ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-14,-42);ctx.lineTo(-26,-40);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-42);ctx.lineTo(-4,-41);ctx.stroke();

  // fore main sail
  ctx.fillStyle='rgba(245,235,200,0.95)';
  ctx.beginPath();ctx.moveTo(-32,-28);ctx.lineTo(0,-29);ctx.lineTo(-2,-14);ctx.lineTo(-28,-13);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#bba870';ctx.lineWidth=0.7;ctx.stroke();
  // sail cross lines
  ctx.beginPath();ctx.moveTo(-32,-28);ctx.lineTo(-2,-14);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-28,-13);ctx.lineTo(0,-29);ctx.stroke();
  // fore topsail
  ctx.fillStyle='rgba(245,235,200,0.9)';
  ctx.beginPath();ctx.moveTo(-26,-40);ctx.lineTo(-4,-41);ctx.lineTo(-6,-30);ctx.lineTo(-24,-29);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#bba870';ctx.lineWidth=0.7;ctx.stroke();

  // === MAINMAST (centre-right) ===
  ctx.strokeStyle='#3d1f00';ctx.lineWidth=3.5;
  ctx.beginPath();ctx.moveTo(8,2);ctx.lineTo(8,-60);ctx.stroke();
  // main yard arm
  ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(8,-46);ctx.lineTo(-16,-42);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-46);ctx.lineTo(34,-42);ctx.stroke();
  // top yard
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(8,-60);ctx.lineTo(-6,-57);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-60);ctx.lineTo(22,-57);ctx.stroke();

  // main sail - RED with BalSnack logo
  ctx.fillStyle='rgba(200,20,20,0.95)';
  ctx.beginPath();
  ctx.moveTo(-16,-42);ctx.bezierCurveTo(-22,-28,-8,-16,8,-14);ctx.bezierCurveTo(24,-16,38,-28,34,-42);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8a0000';ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(-16,-42);ctx.bezierCurveTo(-22,-28,-8,-16,8,-14);ctx.bezierCurveTo(24,-16,38,-28,34,-42);ctx.stroke();
  // BalSnack logo clipped to red sail
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-16,-42);ctx.bezierCurveTo(-22,-28,-8,-16,8,-14);ctx.bezierCurveTo(24,-16,38,-28,34,-42);ctx.closePath();
  ctx.clip();
  ctx.drawImage(BS_IMG, -10, -37, 36, 14);
  ctx.restore();

  // top sail - BIG Jolly Roger
  var wave=Math.sin(tk*0.15)*2;
  ctx.fillStyle='#0d0d0d';
  ctx.beginPath();ctx.moveTo(-6,-57);ctx.lineTo(22,-57);ctx.bezierCurveTo(26,-50,24,-44,18,-42);ctx.lineTo(-2,-42);ctx.bezierCurveTo(-8,-44,-10,-50,-6,-57);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#444';ctx.lineWidth=0.7;ctx.stroke();
  // big skull
  var sc=8+wave*0.2, sx=8, sy=-50;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(sx,sy,sc*0.55,0,Math.PI*2);ctx.fill();
  // jaw
  ctx.beginPath();ctx.arc(sx,sy+sc*0.3,sc*0.38,0,Math.PI);ctx.fill();
  ctx.fillStyle='#0d0d0d';
  // eyes
  ctx.beginPath();ctx.arc(sx-sc*0.22,sy-sc*0.08,sc*0.16,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx+sc*0.22,sy-sc*0.08,sc*0.16,0,Math.PI*2);ctx.fill();
  // teeth
  ctx.fillStyle='#0d0d0d';ctx.fillRect(sx-sc*0.35,sy+sc*0.28,sc*0.7,sc*0.32);
  ctx.fillStyle='#fff';
  for(var ti=0;ti<4;ti++)ctx.fillRect(sx-sc*0.32+ti*sc*0.17,sy+sc*0.29,sc*0.12,sc*0.28);
  // crossbones
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx-sc*0.55,sy+sc*0.7);ctx.lineTo(sx+sc*0.55,sy+sc*1.1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+sc*0.55,sy+sc*0.7);ctx.lineTo(sx-sc*0.55,sy+sc*1.1);ctx.stroke();
  ctx.lineCap='butt';

  // bowsprit sail
  ctx.fillStyle='rgba(245,235,200,0.88)';
  ctx.beginPath();ctx.moveTo(-36,2);ctx.lineTo(-58,-14);ctx.lineTo(-36,-10);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#bba870';ctx.lineWidth=0.7;ctx.stroke();

  // === LANTERNS ===
  ctx.fillStyle='rgba(255,200,50,0.9)';
  ctx.beginPath();ctx.arc(34,-4,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8a6000';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='rgba(255,220,80,0.4)';
  ctx.beginPath();ctx.arc(34,-4,6,0,Math.PI*2);ctx.fill();

  // === WAKE / splash when thrusting ===
  if(bf>0){
    var sp=Math.abs(Math.sin(bf*0.4));
    ctx.fillStyle='rgba(160,210,255,0.55)';
    ctx.beginPath();ctx.ellipse(-44,12,8*sp,4*sp,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-52,15,5*sp,3*sp,-.2,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}
function hud(){
  ctx.font='bold 28px Georgia';ctx.textAlign='center';
  ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(score,W/2,42);
  ctx.fillStyle='#fff';ctx.fillText(score,W/2,42);
}
function overlay(t1,t2,t3,btn){
  // full overlay for start screen - taller
  var isStart = t2==='';
  ctx.fillStyle='rgba(8,4,0,.88)';
  ctx.beginPath();ctx.roundRect(16,30,W-32,H-36,14);ctx.fill();
  ctx.strokeStyle='#c8830a';ctx.lineWidth=2.5;ctx.stroke();

  if(isStart){
    // Title
    ctx.fillStyle='#FFD700';ctx.font='bold 26px Georgia';ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=2;
    ctx.strokeText(t1,W/2,68);ctx.fillText(t1,W/2,68);

    // Description text - smaller font
    ctx.fillStyle='#f5deb3';ctx.font='12px Georgia';ctx.lineWidth=0;
    var lines=['Juhata Piraadilaev läbi takistuste ja püüa','suurimaid aardeid: Balsnacki Mac n Cheese\'i maitselisi krõpse!'];
    lines.forEach(function(l,i){ctx.fillText(l,W/2,92+i*16);});

    // Products side by side, centered
    var gap=12, pw=210, ph=233, kw=79, kh=238;
    var totalW=pw+gap+kw;
    var startX=(W-totalW)/2 - 15;
    var py=122, ky=120;
    var px=startX, kx=startX+pw+gap;
    ctx.drawImage(PIR_IMG, px, py, pw, ph);
    ctx.drawImage(KV_IMG, kx, ky, kw, kh);

    // Product labels
    ctx.fillStyle='#FFD700';ctx.font='bold 11px Georgia';ctx.textAlign='center';
    ctx.fillText('Piraat',px+pw/2, py+ph+13);
    ctx.fillText('Mac n Cheese',px+pw/2, py+ph+26);
    ctx.fillText('Kartulivahvel',kx+kw/2, ky+kh+13);
    ctx.fillText('Mac n Cheese',kx+kw/2, ky+kh+26);

    // +2 badges
    ctx.fillStyle='#cc0000';
    ctx.beginPath();ctx.arc(px+pw/2, py+ph+40, 10, 0, Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(kx+kw/2, ky+kh+40, 10, 0, Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 9px Georgia';
    ctx.fillText('+2', px+pw/2, py+ph+43);
    ctx.fillText('+2', kx+kw/2, ky+kh+43);

    // tip + button inside black overlay at bottom
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px Georgia';ctx.textAlign='center';
    ctx.fillText('klõpsa / tühik = seila', W/2, H-80);
    ctx.fillStyle='#c8830a';ctx.beginPath();ctx.roundRect(W/2-65,H-72,130,30,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 16px Georgia';
    ctx.fillText('Mine mängima', W/2, H-52);

  } else {
    // game over overlay - compact
    ctx.fillStyle='rgba(8,4,0,.82)';
    ctx.beginPath();ctx.roundRect(W/2-130,H/2-90,260,200,12);ctx.fill();
    ctx.strokeStyle='#c8830a';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#FFD700';ctx.font='bold 23px Georgia';ctx.textAlign='center';
    ctx.fillText(t1,W/2,H/2-52);
    ctx.fillStyle='#f5deb3';ctx.font='15px Georgia';
    ctx.fillText(t2,W/2,H/2-20);
    if(t3)ctx.fillText(t3,W/2,H/2+5);
    ctx.drawImage(PIR_IMG, W/2-65, H/2+18, 50, 56);
    ctx.drawImage(KV_IMG,  W/2+18, H/2+14, 24, 72);
    ctx.fillStyle='#c8830a';ctx.beginPath();ctx.roundRect(W/2-55,H/2+88,110,30,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 14px Georgia';
    ctx.fillText(btn,W/2,H/2+108);
    ctx.fillStyle='#1a5c8a';ctx.beginPath();ctx.roundRect(W/2-75,H/2+124,150,28,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 12px Georgia';
    ctx.fillText('🏆 Vaata edetabelit',W/2,H/2+143);
  }
}
function hit(rx,ry,rw,rh){return bird.x-28<rx+rw&&bird.x+28>rx&&bird.y-30<ry+rh&&bird.y+14>ry;}

function frame(){
  if(S==='play'){
    tk++;bird.vy+=G;bird.y+=bird.vy;bird.f=Math.max(0,bird.f-.18);
    var spawnInterval=130;
    if(tk%spawnInterval===1||pipes.length===0){
      // ensure no overlap with last pipe
      var lastX = pipes.length>0 ? pipes[pipes.length-1].x : -999;
      if(lastX < W-180){
        var isNarrow = (Math.floor(tk/spawnInterval)%3===2); // every 3rd pipe is narrow
        var thisGAP = isNarrow ? Math.round(GAP*0.8) : GAP;
        var minTop=H*0.08, maxTop=H*0.55-thisGAP;
        var top=minTop+Math.random()*(maxTop-minTop);
        pipes.push({x:W,top:top,ok:false,gap:thisGAP});
        if(Math.random()<.65){
          var t=Math.random()<.5?'p':'k';
          var dh=t==='p'?60:66, dw=t==='p'?54:22;
          // varied positions: center, near top pipe, near bottom pipe, or random in gap
          var pos=Math.random();
          var gapCenter=top+thisGAP/2;
          var dropY;
          if(pos<0.4){
            dropY=gapCenter-dh/2; // center
          } else if(pos<0.6){
            dropY=top+8; // just below top pipe
          } else if(pos<0.8){
            dropY=top+thisGAP-dh-8; // just above bottom pipe
          } else {
            dropY=top+8+Math.random()*(thisGAP-dh-16); // fully random in gap
          }
          drops.push({x:W+30,y:dropY,t:t,ph:Math.random()*6.28,dw:dw,dh:dh});
        }
      }
    }
    pipes.forEach(function(p){p.x-=(SPD+score*0.04);if(!p.ok&&p.x+PW<bird.x){p.ok=true;score++;}});
    drops=drops.filter(function(d){var spd=SPD+score*0.04;
      d.x-=spd;if(hit(d.x,d.y,d.dw,d.dh)){score+=2;return false;}return d.x+d.dw>0;
    });
    pipes=pipes.filter(function(p){return p.x+PW>0;});
    var dead=bird.y>H-10;
    pipes.forEach(function(p){if(hit(p.x,0,PW,p.top)||hit(p.x,p.top+(p.gap||GAP),PW,H))dead=true;});
    if(dead){if(score>best)best=score;lastScore=score;S='dead';deadTk=tk;
      var nick=window._pirNick||'Anonüümne';
      var em=window._pirEmail||'';
      saveScore(nick,em,lastScore,function(){
        fetchLeaderboard(function(scores,week){
          var rank=-1;
          for(var i=0;i<scores.length;i++){if(scores[i].nickname===nick&&scores[i].score===lastScore){rank=i;break;}}
          if(rank>=0&&rank<3){
            window._topRank=rank;
            showLeaderboard(scores,week);
          } else {
            window._topRank=-1;
          }
        });
      });
    }
  } else { tk++; }
  ctx.clearRect(0,0,W,H);
  sky();
  drawSeabed();
  if(S!=='start')pipes.forEach(drawPipe);
  drops.forEach(drawDrop);
  if(S==='start'){
    parrot(85,H*0.55+Math.sin(tk*0.04)*5,0,0);
    overlay('⚓ Kapten Piraat','','','Alusta!');
  } else {
    parrot(bird.x,bird.y,bird.vy,bird.f);hud();
    if(S==='dead')overlay('Arrgghh! Uppusite!','Skoor: '+lastScore,'','Mängi uuesti!');
  }
  requestAnimationFrame(frame);
}
frame();
}; // end window.onload
</script>
